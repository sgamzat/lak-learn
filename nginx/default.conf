# Ограничение частоты запросов к эндпоинтам авторизации (защита от перебора паролей).
# 10 запросов в минуту с одного IP, кратковременный всплеск до 5 — без задержки.
# Файлы conf.d подключаются в контекст http, поэтому limit_req_zone можно объявить здесь.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  # Общие заголовки проксирования
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Оптимизатор картинок Next.js отключён (next.config.mjs), эндпоинт закрыт и на уровне прокси
  location ^~ /_next/image {
    return 404;
  }

  location ^~ /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://app:3000;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
