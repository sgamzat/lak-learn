# РАЗОВЫЙ workflow: обновляет пакеты под Next 16 и коммитит package-lock.json
# обратно в ветку chore/next-16. После мержа PR этот файл удаляется.
name: Update deps (Next 16)

on:
  push:
    branches: [chore/next-16]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Нужно ли обновление
        id: check
        run: |
          major=$(node -p "require('./package.json').dependencies.next.replace(/[^0-9.]/g,'').split('.')[0]")
          echo "next major: $major"
          if [ "$major" -ge 16 ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Обновление пакетов
        if: steps.check.outputs.needed == 'true'
        run: |
          set -o pipefail
          npm i --no-audit --no-fund next@16 eslint-config-next@16 react@19 react-dom@19 lucide-react@latest framer-motion@latest 2>&1 | tee -a ci.log
          npm i --no-audit --no-fund -D @types/react@19 @types/react-dom@19 eslint@9 2>&1 | tee -a ci.log

      - name: Коммит lockfile
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: next 16, react 19, eslint 9 (npm install в CI)"
          git push

      - name: Установка (если обновление уже было)
        if: steps.check.outputs.needed == 'false'
        run: npm ci --no-audit --no-fund 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Тесты
        run: npm test 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Сборка
        run: npm run build 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Линтер (не блокирует)
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log; exit ${PIPESTATUS[0]}

      - name: Аудит зависимостей прода (не блокирует)
        continue-on-error: true
        run: npm audit --omit=dev 2>&1 | tail -20 | tee audit.log

      - name: Итог в PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          pr=$(gh pr list --head chore/next-16 --json number --jq '.[0].number')
          [ -n "$pr" ] || exit 0
          {
            if [ "$STATUS" = "success" ]; then echo "### ✅ Next 16: пакеты обновлены, тесты и сборка прошли"; else echo "### ❌ Next 16: ошибка"; fi
            echo
            echo "Версии: $(node -p "const p=require('./package.json'); ['next','react','eslint-config-next'].map(n=>n+' '+(p.dependencies[n]||p.devDependencies[n])).join(', ')")"
            if [ "$STATUS" != "success" ]; then
              echo; echo "<details open><summary>Последние строки лога</summary>"; echo; echo '```'
              tail -80 ci.log 2>/dev/null; echo '```'; echo "</details>"
            fi
            if [ -f lint.log ]; then
              echo; echo "<details><summary>Линтер (не блокирует)</summary>"; echo; echo '```'
              tail -40 lint.log; echo '```'; echo "</details>"
            fi
            if [ -f audit.log ]; then
              echo; echo "<details><summary>npm audit --omit=dev</summary>"; echo; echo '```'
              cat audit.log; echo '```'; echo "</details>"
            fi
          } > summary.md
          gh pr comment "$pr" --body-file summary.md
