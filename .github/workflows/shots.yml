# Временный: скриншоты мобильного интерфейса ветки feat/lessons. Ветку удалить после использования.
name: shots
on:
  push:
    branches: [chore/deps-artifact]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lak_user
          POSTGRES_PASSWORD: lak_pass
          POSTGRES_DB: lak_learn
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: lak_pass
      DATABASE_URL: postgres://lak_user:lak_pass@localhost:5432/lak_learn
      JWT_ACCESS_SECRET: ci-access-4f8a1c2e9b7d6a5f3e2d1c0b9a8f7e6d
      JWT_REFRESH_SECRET: ci-refresh-9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { path: self }
      - uses: actions/checkout@v4
        with: { ref: fix/dashboard-header, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: deps
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: db
        working-directory: app
        run: sh db/migrate.sh db/migrations db/seeds > migrate.log 2>&1 || (tail -40 migrate.log; exit 1)
      - name: build
        working-directory: app
        run: npm run build > build.log 2>&1 || (tail -60 build.log; exit 1)
      - name: start
        working-directory: app
        run: |
          (NODE_ENV=production npx next start -p 3000 > server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - name: playwright
        working-directory: app
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
      - name: shots
        working-directory: app
        run: |
          mkdir -p shots
          cp ../self/tools/shots.cjs ./shots.cjs && node shots.cjs > shots/log.txt 2>&1 || (cat shots/log.txt; tail -50 server.log; exit 1)
      - name: push
        if: always()
        working-directory: self
        run: |
          rm -rf shots && mkdir -p shots
          cp -r ../app/shots/. shots/ || true
          cp ../app/server.log shots/server.log || true
          ls -la shots
          git config user.name "shots-bot" && git config user.email "shots@example.com"
          git add -A shots && git commit -m "shots" && git push origin HEAD:chore/deps-artifact
