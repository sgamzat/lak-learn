<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучаем Лакский</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🦉 LakLingo</h1>
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
            <p>Урок <span id="current-step">1</span> из <span id="total-steps">10</span></p>
        </header>

        <main id="game-area">
            <h2 id="question-text">Загрузка...</h2>
            <div id="options-container" class="options-grid">
                <!-- Кнопки появятся здесь -->
            </div>
            <div id="feedback" class="feedback"></div>
        </main>

        <footer>
            <button id="next-btn" class="hidden">Дальше</button>
        </footer>
    </div>

    <!-- Сначала загружаем данные, потом логику -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
