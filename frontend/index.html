<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучаем Лакский</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Экран авторизации -->
        <div id="auth-screen">
            <h1>🦉 LakLingo</h1>
            <div class="auth-forms">
                <form id="login-form">
                    <h2>Вход</h2>
                    <input type="text" id="login-username" placeholder="Логин" required>
                    <input type="password" id="login-password" placeholder="Пароль" required>
                    <button type="submit" class="primary-btn">Войти</button>
                </form>
                <form id="register-form">
                    <h2>Регистрация</h2>
                    <input type="text" id="register-username" placeholder="Логин" required>
                    <input type="password" id="register-password" placeholder="Пароль" required>
                    <button type="submit" class="secondary-btn">Создать аккаунт</button>
                </form>
            </div>
            <div id="auth-error" class="error-msg"></div>
        </div>

        <!-- Экран игры (скрыт по умолчанию) -->
        <div id="game-screen" class="hidden">
            <header>
                <h1>🦉 LakLingo</h1>
                <div class="user-info">
                    <span id="username-display"></span>
                    <button id="logout-btn" class="logout-btn">Выйти</button>
                </div>
                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>
                <p>Урок <span id="current-step">1</span> из <span id="total-steps">10</span></p>
            </header>

            <main id="game-area">
                <h2 id="question-text">Загрузка...</h2>
                <div id="options-container" class="options-grid"></div>
                <div id="feedback" class="feedback"></div>
            </main>

            <footer>
                <button id="next-btn" class="hidden">Дальше</button>
            </footer>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
